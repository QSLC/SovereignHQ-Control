services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./app:/usr/share/nginx/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        envsubst '$${SUPABASE_URL} $${SUPABASE_ANON_KEY} $${STRIPE_PUBLISHABLE_KEY} $${APP_NAME} $${APP_URL}' \
          < /usr/share/nginx/html/env.template.js > /tmp/env.js \
        && exec nginx -g 'daemon off;'
    depends_on:
      docker-health:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 5s
      timeout: 3s
      retries: 10

  docker-health:
    image: python:3.12-slim
    volumes:
      - ./docker-health:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: python /app/server.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
