server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Generated env.js served from /tmp so secrets never touch the repo
    location = /env.js {
        alias /tmp/env.js;
        default_type application/javascript;
    }

    # Proxy API requests to the Docker health backend
    location /api/ {
        proxy_pass http://docker-health:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
