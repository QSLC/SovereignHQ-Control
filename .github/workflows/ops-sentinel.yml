name: QSLC Ops Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: '15 15 * * *'

permissions:
  contents: read
  issues: write

jobs:
  inventory-and-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate registry JSON
        run: python -m json.tool config/apps.json >/dev/null

      - name: Check configured public endpoints
        shell: bash
        env:
          QSLC_PRIMARY_URL: ${{ vars.QSLC_PRIMARY_URL }}
          QSLC_API_URL: ${{ vars.QSLC_API_URL }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          : > artifacts/health.txt

          endpoints=(
            "${QSLC_PRIMARY_URL:-https://qslc-sovereign-command.lovable.app}"
            "${QSLC_API_URL:-https://fastapi-python-boilerplate-mcoe5ag0j-qslc-16cb8a0f.vercel.app}"
            "https://chatbot-kc5vgpxhg-qslc.vercel.app"
          )

          for url in "${endpoints[@]}"; do
            [ -z "$url" ] && continue
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            printf '%s %s\n' "$code" "$url" | tee -a artifacts/health.txt
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "HEALTH_FAILURE=1" >> "$GITHUB_ENV"
            fi
          done

      - name: Scan repository for accidentally committed secret-like files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.p12' -o -name '*credentials*.json' \) -not -path './.git/*' | grep -q .; then
            echo 'SECRET_FILE_WARNING=1' >> "$GITHUB_ENV"
          fi

      - name: Open an issue when health checks fail
        if: env.HEALTH_FAILURE == '1' || env.SECRET_FILE_WARNING == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Ops Sentinel alert $(date -u +%F)"
          body="Automated checks found a deployment-health or secret-hygiene warning. Review the latest QSLC Ops Sentinel run. No bank, payroll, DNS, API-key, or production mutation is performed automatically by this workflow."
          existing=$(gh issue list --state open --search 'Ops Sentinel alert in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Summary
        run: |
          echo '## QSLC Ops Sentinel' >> "$GITHUB_STEP_SUMMARY"
          echo '- Registry: validated' >> "$GITHUB_STEP_SUMMARY"
          echo '- Plaintext secret storage: prohibited' >> "$GITHUB_STEP_SUMMARY"
          echo '- Provider mutations: disabled unless separately authorized and configured' >> "$GITHUB_STEP_SUMMARY"
          echo '- Cloudflare: connected through ChatGPT; DNS/zone inventory is handled separately from this workflow' >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/health.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/health.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
